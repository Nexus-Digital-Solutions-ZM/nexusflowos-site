<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="badgeGrad" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#F3B94A"/>
      <stop offset="100%" stop-color="#E8A020"/>
    </radialGradient>
  </defs>

  <!-- container -->
  <rect x="4" y="4" width="192" height="192" rx="36" fill="#0A1628"/>

  <!-- live/gauge arc (cyan) -->
  <path d="M 100 34 A 66 66 0 1 1 41 132" fill="none" stroke="#00AACC" stroke-width="6" stroke-linecap="round"/>
  <circle cx="41" cy="132" r="6.5" fill="#00AACC"/>

  <!-- accent dot (gold), echoes parent Nexus node-dot motif -->
  <circle cx="152" cy="148" r="5.5" fill="#E8A020"/>

  <!-- gold gauge badge -->
  <circle cx="100" cy="102" r="56" fill="url(#badgeGrad)"/>
  <circle cx="100" cy="102" r="56" fill="none" stroke="#0A1628" stroke-width="2" opacity="0.15"/>

  <!-- fuel pump glyph, centered -->
  <g transform="translate(100,102)">
    <!-- base shadow -->
    <rect x="-24" y="42" width="48" height="4" rx="2" fill="#0A1628" opacity="0.55"/>
    <!-- cabinet top ledge -->
    <rect x="-22" y="-30" width="42" height="9" rx="3" fill="#0A1628"/>
    <!-- cabinet body -->
    <rect x="-20" y="-21" width="38" height="55" rx="5" fill="#0A1628"/>
    <!-- screen window -->
    <rect x="-13" y="-11" width="22" height="15" rx="2" fill="#00AACC"/>
    <!-- keypad dots -->
    <circle cx="-8" cy="15" r="2.6" fill="#F3B94A"/>
    <circle cx="0" cy="15" r="2.6" fill="#F3B94A"/>
    <circle cx="8" cy="15" r="2.6" fill="#F3B94A"/>
    <!-- hose -->
    <path d="M 18 -14 C 34 -14, 36 6, 30 18" fill="none" stroke="#0A1628" stroke-width="5" stroke-linecap="round"/>
    <!-- nozzle -->
    <path d="M 24 15 L 40 8 L 46 18 L 30 26 Z" fill="#0A1628"/>
  </g>
</svg>
